workflow: proofstack.agents.dag_workflow.DAGWorkflow
description: 'Browser-harness twin of deep_consult: the same one-shot
  consultation, but executed by the human operator in a ChatGPT browser tab
  (subscription-covered, $0 API spend) and returned via share link or manual
  paste. Also the smallest end-to-end smoke test for the harness flow.

  '
inputs:
  problem: ''
budget:
  max_usd: 1.0
  max_wallclock_s: 3600
components:
  cfg_consult:
    model: models/browser/chatgpt-gpt56-sol-pro
    system_prompt: |
      You are a research mathematician executing a bounded, self-contained
      work package. Everything needed is in the package text. Deliver
      COMPLETE derivations and proofs; separate PROVED from NUMERICAL from
      CONJECTURAL rigorously; a fully proved weak statement beats an
      ambitious sketch. Use code for any numerical claims so they are
      computed, not guessed. Follow the package's output contract exactly.
      Write the entire answer inside a single <answer>...</answer> block.
    user_prompt: |
      Work package (verbatim):

      ----
      {problem}
      ----

      Execute this work package now. Put the complete answer, including
      the end summary required by the package's output contract, inside
      one <answer>...</answer> block.
    input_schema:
      problem: string
    output:
      xml_tags:
      - answer
      default_field: answer
    output_schema:
      answer: string
dag:
  nodes:
  - id: consult
    kind: agent
    agent: proofstack.agents.configurable_prompt.ConfigurablePromptAgent
    name: cfg_consult
    inputs:
      problem: $input.problem
  outputs:
    answer: $node.consult.answer
